        // --- INIT & ROUTER ---
        async function init() {
            const data = await fetchData();
            if (!data) return;

            globalConfig = data.config;
            
            currentApps = (data.apps || []).filter(a => {
                return String(a.Visible).toLowerCase() === 'true' || String(a.visible).toLowerCase() === 'true';
            });
            
            currentPages = (data.pages || []).filter(p => {
                return String(p.visible).toLowerCase() === 'true';
            });

            injectPixels(globalConfig);
            
            // Hapus Loading Spinner secara perlahan dengan menambah kelas hidden
            const loadingSpinner = document.getElementById('loading-spinner');
            loadingSpinner.classList.add('hidden');

            const urlParams = new URLSearchParams(window.location.search);
            const activeSlug = urlParams.get('page');

            if (activeSlug) {
                // TAMPILKAN SPESIFIK LANDING PAGE DARI SHEET_PAGES
                renderLandingPage(activeSlug);
            } else {
                // TAMPILKAN BIO-LINK UTAMA
                renderProfile(data.config);
                renderSocials(data.socials);
                renderCategories(currentApps);
                updateDisplay();

                const btnMarketplace = document.getElementById('btn-marketplace');
                if (globalConfig.show_marketplace && String(globalConfig.show_marketplace).toLowerCase() === 'false') {
                    btnMarketplace.classList.add('hidden');
                } else {
                    if (currentPages.length > 0) {
                        btnMarketplace.classList.remove('hidden');
                    }
                }

                const vipSection = document.getElementById('vip-list-section');
                if (globalConfig.show_vip_form && String(globalConfig.show_vip_form).toLowerCase() === 'false') {
                    vipSection.classList.add('hidden');
                } else {
                    vipSection.classList.remove('hidden');
                }
                
                const mainContent = document.getElementById('main-content');
                mainContent.classList.remove('hidden');
                setTimeout(() => {
                    mainContent.classList.remove('opacity-0');
                }, 50);
            }

            document.getElementById('year').innerText = new Date().getFullYear();
            document.getElementById('footer-name').innerText = data.config.profile_name || '';
            document.getElementById('footer-text').innerText = data.config.footer_text || '';
            setupSearch();
        }

        // --- FUNGSI UPDATE DISPLAY BIO-LINK ---
        function updateDisplay() {
            let filteredApps = currentApps.filter(app => {
                const appCategories = (app.Category || '').split(',').map(c => c.trim());
                const nameCheck = (app.Name || '').toLowerCase().includes(searchQuery);
                const descCheck = (app.Description || '').toLowerCase().includes(searchQuery);
                const matchesSearch = nameCheck || descCheck;
                
                const matchesCategory = activeCategory === 'Semua' || appCategories.includes(activeCategory);
                
                return matchesSearch && matchesCategory;
            });

            const totalItems = filteredApps.length;
            const paginatedApps = filteredApps.slice((currentPage - 1) * ITEMS_PER_PAGE, currentPage * ITEMS_PER_PAGE);

            renderApps(paginatedApps);
            renderPagination(totalItems);
        }

        window.changePage = (p) => { 
            currentPage = p; 
            updateDisplay(); 
            window.scrollTo({
                top: 0, 
                behavior: 'smooth'
            }); 
        };

        // --- FUNGSI PAGINASI ---
        function renderPagination(totalItems) {
            const container = document.getElementById('pagination-container');
            const totalPages = Math.ceil(totalItems / ITEMS_PER_PAGE);
            
            if (totalPages <= 1) { 
                container.innerHTML = ''; 
                return; 
            }

            let html = '';
            let prevDisabled = '';
            
            if (currentPage === 1) {
                prevDisabled = 'opacity-30 cursor-not-allowed pointer-events-none';
            } else {
                prevDisabled = 'hover:bg-white/40 cursor-pointer';
            }
            
            html += `<button onclick="changePage(${currentPage - 1})" class="w-8 h-8 md:w-10 md:h-10 flex items-center justify-center rounded-xl glass transition-all ${prevDisabled}"><i class="fas fa-chevron-left text-xs"></i></button>`;
            
            for (let i = 1; i <= totalPages; i++) {
                let activeClass = '';
                if (i === currentPage) {
                    activeClass = 'glass-active font-bold text-purple-600 scale-110 shadow-md';
                } else {
                    activeClass = 'hover:bg-white/40 cursor-pointer';
                }
                html += `<button onclick="changePage(${i})" class="w-8 h-8 md:w-10 md:h-10 flex items-center justify-center rounded-xl glass transition-all text-sm ${activeClass}">${i}</button>`;
            }
            
            let nextDisabled = '';
            if (currentPage === totalPages) {
                nextDisabled = 'opacity-30 cursor-not-allowed pointer-events-none';
            } else {
                nextDisabled = 'hover:bg-white/40 cursor-pointer';
            }
            
            html += `<button onclick="changePage(${currentPage + 1})" class="w-8 h-8 md:w-10 md:h-10 flex items-center justify-center rounded-xl glass transition-all ${nextDisabled}"><i class="fas fa-chevron-right text-xs"></i></button>`;
            container.innerHTML = html;
        }

        // --- FILTER KATEGORI ---
        window.filterCategory = (category) => {
            activeCategory = category; 
            currentPage = 1;
            
            const allButtons = document.querySelectorAll('#category-container button');
            allButtons.forEach(b => {
                b.classList.remove('glass-active');
            });
            
            const btnId = `btn-cat-${category.replace(/\s+/g, '-')}`;
            const btn = document.getElementById(btnId);
            if (btn) {
                btn.classList.add('glass-active');
            }
            updateDisplay();
        };

        function renderCategories(apps) {
            const container = document.getElementById('category-container');
            const allCats = apps.flatMap(a => {
                return (a.Category || '').split(',').map(c => c.trim()).filter(Boolean);
            });
            
            const uniqueCats = [...new Set(allCats)].sort((a, b) => a.localeCompare(b));
            
            if (uniqueCats.length === 0) {
                return;
            }
            
            const finalCats = ['Semua', ...uniqueCats];
            
            const catsHtml = finalCats.map(cat => {
                const id = `btn-cat-${cat.replace(/\s+/g, '-')}`;
                let activeClass = '';
                if (cat === 'Semua') {
                    activeClass = 'glass-active';
                }
                return `<button onclick="window.filterCategory('${cat}')" id="${id}" class="px-5 py-2.5 rounded-2xl text-xs md:text-sm font-bold whitespace-nowrap transition-all outline-none snap-start glass glass-btn ${activeClass}">${cat}</button>`;
            }).join('');
            
            container.innerHTML = catsHtml;
        }

        // --- RENDER BASIC ---
        function renderProfile(c) {
            document.getElementById('profile-name').innerText = c.profile_name;
            document.getElementById('profile-title').innerText = c.profile_title;
            document.getElementById('profile-image').src = c.profile_image;
            
            if (String(c.verified_badge).toLowerCase() === 'true') {
                document.getElementById('verified-badge').classList.remove('hidden');
            }
        }

        function renderSocials(socs) {
            const container = document.getElementById('socials-container');
            
            socs.forEach((s, i) => {
                if (String(s.Visible).toLowerCase() !== 'true') {
                    return;
                }
                
                const a = document.createElement('a'); 
                a.href = s.Url; 
                a.target = "_blank";
                a.className = `w-12 h-12 md:w-14 md:h-14 rounded-full glass glass-btn flex items-center justify-center text-xl md:text-2xl shadow-sm hover:scale-110 transition-transform animate-stagger ${s.ColorClass}`;
                a.style.animationDelay = `${0.15 + (i * 0.05)}s`; 
                a.innerHTML = `<i class="${s.IconClass}"></i>`;
                
                container.appendChild(a);
            });
        }

        function setupSearch() {
            const searchInput = document.getElementById('app-search');
            
            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value.toLowerCase();
                
                if (isMarketplaceOpen) {
                    const filtered = currentPages.filter(p => {
                        return p.title.toLowerCase().includes(searchQuery);
                    });
                    renderMarketplace(filtered);
                } else {
                    currentPage = 1;
                    updateDisplay();
                }
            });
        }

        // --- MARKETPLACE & FULL LANDING PAGE CMS ---
        function renderLandingPage(slug) {
            const pageData = currentPages.find(p => p.slug === slug);
            const container = document.getElementById('landing-page-content');
            const view = document.getElementById('landing-page-view');
            
            if (pageData) {
                // Menambahkan sentuhan background blur eksklusif ke dalam content (Seperti Kartu VIP)

                    <div class="absolute -top-10 -right-10 w-32 h-32 bg-purple-500/20 rounded-full blur-2xl pointer-events-none"></div>
                    <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-pink-500/20 rounded-full blur-2xl pointer-events-none"></div>
                    <div class="relative z-10 w-full text-center">
                        ${pageData.html_content}

                    </div>
                `;

        function goBackHome() {
            window.history.pushState({}, document.title, window.location.pathname);
            window.location.reload(); 
        }

        function goToPage(slug) {
            const url = new URL(window.location);
            url.searchParams.set('page', slug);
            window.history.pushState({}, '', url);
            window.location.reload();
        }

        function toggleMarketplace() {
            isMarketplaceOpen = !isMarketplaceOpen;
            
            const btnText = document.getElementById('text-marketplace');
            const appCont = document.getElementById('apps-container');
            const markCont = document.getElementById('marketplace-container');
            const catWrap = document.getElementById('cat-wrapper');
            const pagiCont = document.getElementById('pagination-container');

            if (isMarketplaceOpen) {
                btnText.innerText = "Tutup Marketplace";
                
                appCont.classList.add('hidden');
                catWrap.classList.add('hidden');
                pagiCont.classList.add('hidden');
                
                markCont.classList.remove('hidden');
                renderMarketplace(currentPages);
            } else {
                btnText.innerText = "Buka Marketplace Promo";
                
                appCont.classList.remove('hidden');
                catWrap.classList.remove('hidden');
                pagiCont.classList.remove('hidden');
                
                markCont.classList.add('hidden');
            }
        }

        function renderMarketplace(pages) {
            const container = document.getElementById('marketplace-container');
            container.innerHTML = '';

            if (pages.length === 0) {
                container.innerHTML = `
                    <div class="col-span-2 text-center py-6 opacity-60">Katalog masih kosong.</div>
                `; 
                return;
            }

                            <i class="fas fa-external-link-alt"></i> Buka
                        </div>

        // --- PASSWORD MODAL & TRACKING ---
        function openPasswordModal(id, name, passUrl) {
            document.getElementById('locked-app-id').value = id;
            document.getElementById('locked-app-name').innerText = name;
            
            document.getElementById('password-error').classList.add('hidden');
            document.getElementById('app-password').value = '';
            
            document.getElementById('password-modal').classList.remove('hidden');
            
            setTimeout(() => {
                document.getElementById('password-modal-content').classList.remove('scale-95', 'opacity-0');
            }, 10);
        }

        function closePasswordModal() {
            document.getElementById('password-modal-content').classList.add('scale-95', 'opacity-0');
            
            setTimeout(() => {
                document.getElementById('password-modal').classList.add('hidden');
            }, 300);
        }

        function togglePasswordVisibility(id, btn) {
            const input = document.getElementById(id);
            const icon = btn.querySelector('i');
            
            if (input.type === 'password') { 
                input.type = 'text'; 
                icon.classList.replace('fa-eye', 'fa-eye-slash'); 
            } else { 
                input.type = 'password'; 
                icon.classList.replace('fa-eye-slash', 'fa-eye'); 
            }
        }

        document.getElementById('password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('unlock-btn');
            const err = document.getElementById('password-error');
            const id = document.getElementById('locked-app-id').value;
            const pass = document.getElementById('app-password').value;
            
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>'; 
            btn.disabled = true; 
            err.classList.add('hidden');
            
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ 
                        action: 'verifyPassword', 
                        appId: id, 
                        password: pass 
                    }),
                    headers: { 
                        'Content-Type': 'text/plain;charset=utf-8' 
                    }
                });
                
                const res = await response.json();
                
                if (res.success) { 
                    closePasswordModal(); 
                    window.open(res.url, '_blank'); 
                    incrementClick(id); 
                } else { 
                    err.innerText = res.message; 
                    err.classList.remove('hidden'); 
                }
            } catch(error) { 
                err.innerText = "Koneksi gagal."; 
                err.classList.remove('hidden'); 
            } finally { 
                btn.innerHTML = 'Buka'; 
                btn.disabled = false; 
            }
        });

        function incrementClick(appId) {
            fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ 
                    action: 'incrementClick', 
                    appId: appId 
                }),
                headers: { 
                    'Content-Type': 'text/plain;charset=utf-8' 
                }
            }).catch(() => {
                // Silently fail if incrementing click fails
            });
        }

        // --- LEAD FORM ---
        async function submitLeadForm(e) { 
            e.preventDefault();
            
            const btn = document.getElementById('lead-submit-btn');
            const msg = document.getElementById('lead-msg');
            const originalText = btn.innerText;
            
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Memproses...'; 
            btn.disabled = true; 
            msg.classList.add('hidden');

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ 
                        action: 'addLead', 
                        name: document.getElementById('lead-name').value, 
                        email: document.getElementById('lead-email').value, 
                        wa: document.getElementById('lead-wa').value 
                    }),
                    headers: { 
                        'Content-Type': 'text/plain;charset=utf-8' 
                    }
                });
                
                const resJson = await response.json();
                
                if (resJson.success) {
                    msg.innerText = "Terima kasih! Mengarahkan..."; 
                    msg.className = "text-xs text-center font-bold mt-3 text-green-500 block";
                    document.getElementById('lead-form').reset();
                    
                    setTimeout(() => { 
                        if (globalConfig.vip_redirect_url) {
                            window.open(globalConfig.vip_redirect_url, '_blank'); 
                        }
                    }, 1500);
                } else {
                    throw new Error("Failed to submit lead");
                }
            } catch (err) {
                msg.innerText = "Koneksi terputus. Coba lagi."; 
                msg.className = "text-xs text-center font-bold mt-3 text-red-500 block";
            } finally {
                btn.innerHTML = originalText; 
                btn.disabled = false; 
                
                setTimeout(() => {
                    msg.classList.add('hidden');
                }, 4000);
            }
        }

        // --- THEME & SHARE ---
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            
            if (document.documentElement.classList.contains('dark')) {
                localStorage.theme = 'dark';
            } else {
                localStorage.theme = 'light';
            }
        }

        function shareProfile() {
            if (navigator.share) {
                navigator.share({ 
                    title: document.title, 
                    url: window.location.href 
                }).catch(() => {
                    // Fail silently
                });
            } else {
                const dummy = document.createElement('input'); 
                document.body.appendChild(dummy);
                dummy.value = window.location.href; 
                dummy.select(); 
                document.execCommand('copy'); 
                document.body.removeChild(dummy);
                
                const toast = document.getElementById('toast');
                toast.classList.remove('opacity-0', 'pointer-events-none');
                
                setTimeout(() => {
                    toast.classList.add('opacity-0', 'pointer-events-none');
                }, 3000);
            }
        }

        init();
    </script>
</body>
</html>
