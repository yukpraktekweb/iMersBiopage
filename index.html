<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iMersBiopage - Smart Landing Page</title>
    
    <!-- ============================================================
         1. ASSET & RESOURCE INITIALIZATION
         ============================================================
         Bagian ini memuat semua library eksternal yang dibutuhkan 
         untuk identitas visual iMers Biopage.
         ============================================================ -->
    
    <!-- Favicon: Ikon tab browser -->
    <link rel="icon" type="image/png" href="https://ui-avatars.com/api/?name=iMersBiopage&background=7c3aed&color=fff&size=32">
    
    <!-- Google Fonts: Menggunakan font Outfit sebagai identitas utama -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;900&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS: Framework utama untuk desain modern -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome: Koleksi ikon lengkap -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind Configuration: Pengaturan kustom animasi dan tema -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['"Outfit"', 'sans-serif'],
                        poppins: ['"Poppins"', 'sans-serif']
                    },
                    animation: { 
                        blob: "blob 7s infinite", 
                        pulseGlow: "pulseGlow 2s infinite" 
                    },
                    keyframes: {
                        blob: {
                            "0%": { transform: "translate(0px, 0px) scale(1)" },
                            "33%": { transform: "translate(30px, -50px) scale(1.1)" },
                            "66%": { transform: "translate(-20px, 20px) scale(0.9)" },
                            "100%": { transform: "translate(0px, 0px) scale(1)" }
                        },
                        pulseGlow: { 
                            "0%, 100%": { opacity: 1, transform: "scale(1)" }, 
                            "50%": { opacity: .9, transform: "scale(1.02)" } 
                        }
                    }
                }
            }
        }
    </script>

    <!-- ============================================================
         2. CUSTOM GLASSMORPHISM & UTILITY CSS
         ============================================================
         Bagian ini berisi pengaturan CSS sakti untuk efek kaca dan 
         perbaikan desain nempel mentok (Zero Margin).
         ============================================================ -->
    <style>
        /* Dasar Tampilan iMers Biopage */
        body { 
            font-family: 'Outfit', sans-serif; 
            background-color: #f3f4f6; 
            color: #1f2937; 
            transition: background-color 0.4s ease, color 0.4s ease; 
        }

        /* Konfigurasi Mode Gelap */
        .dark body { 
            background-color: #111827; 
            color: #f9fafb; 
        }

        /* Efek Panel Kaca (Glass Panel) */
        .glass { 
            background: rgba(255, 255, 255, 0.4); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px); 
            border: 1px solid rgba(255, 255, 255, 0.6); 
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1); 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }

        .dark .glass { 
            background: rgba(17, 24, 39, 0.6); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3); 
        }

        /* Hover Kartu & Tombol */
        .glass-btn:hover, .glass-card:hover { 
            background: rgba(255, 255, 255, 0.6); 
            transform: translateY(-3px); 
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.15); 
            border: 1px solid rgba(255, 255, 255, 0.8); 
        }

        .dark .glass-btn:hover, .dark .glass-card:hover { 
            background: rgba(31, 41, 55, 0.8); 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); 
        }

        /* Input Field Kaca */
        .glass-input { 
            background: rgba(255, 255, 255, 0.3); 
            backdrop-filter: blur(8px); 
            border: 1px solid rgba(255, 255, 255, 0.5); 
        }

        .dark .glass-input { 
            background: rgba(0, 0, 0, 0.3); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
        }

        /* Status Tab Aktif */
        .glass-active { 
            background: rgba(255, 255, 255, 0.8) !important; 
            border-color: rgba(255, 255, 255, 1) !important; 
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5); 
        }

        .dark .glass-active { 
            background: rgba(59, 130, 246, 0.5) !important; 
            border-color: rgba(96, 165, 250, 0.8) !important; 
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3); 
        }

        /* Animasi Transisi Halus */
        @keyframes fadeSlideUp { 
            0% { opacity: 0; transform: translateY(20px); } 
            100% { opacity: 1; transform: translateY(0); } 
        }

        .animate-stagger { 
            opacity: 0; 
            animation: fadeSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
            will-change: transform, opacity; 
        }

        /* Tactile Feedback (Tap) */
        .tap-effect { 
            transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1); 
        }

        .tap-effect:active { 
            transform: scale(0.96) !important; 
        }

        /* Utils & Masking */
        ::-webkit-scrollbar { width: 0px; height: 0px; }

        .fade-mask { 
            mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent); 
            -webkit-mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent); 
        }

        input::placeholder, textarea::placeholder { 
            color: inherit; 
            opacity: 0.6; 
        }

        /* List Gaya Kartu Harga */
        .pricing-list ul { 
            padding-left: 0.5rem; 
            margin-bottom: 1.5rem; 
            text-align: left; 
        }

        .pricing-list li { 
            margin-bottom: 0.5rem; 
            display: flex; 
            align-items: flex-start; 
            gap: 0.5rem; 
        }

        /* ============================================================
           FIX: ZERO MARGIN TOTAL (FULL IMAGE MODAL)
           ============================================================
           Settingan ini akan menghapus semua padding di kontainer modal 
           agar gambar konten bisa menempel mentok ke tepi kartu.
           ============================================================ */
        
        #landing-page-content {
            padding: 0px !important; 
            overflow: hidden;
            border: none !important;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        /* Wrapper khusus untuk teks agar tidak nempel ke tepi tembok modal */
        .lp-text-wrapper {
            padding-left: 1.5rem;
            padding-right: 1.5rem;
            padding-bottom: 2rem;
            text-align: center;
        }

        @media (min-width: 768px) {
            .lp-text-wrapper {
                padding-left: 2rem;
                padding-right: 2rem;
                padding-bottom: 3rem;
            }
        }
    </style>

    <!-- Script Inisialisasi Tema (Dark Mode Persistence) -->

            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>

    <!-- ============================================================
         3. CORE JAVASCRIPT ENGINE (iMERS SYSTEM v2.8)
         ============================================================
         Logic pemrosesan data, rendering, tracking, dan keamanan.

    <script>
        /**
         * INITIAL CONFIGURATION
         * Lokasi backend Google Apps Script.
         */
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxOOuq8euMjbH-XNkjqdBASmj_a1qvK4DP5SiHotX_mEOspwvybUuUdFwUibl8N4r6Olw/exec';
        
        let currentPage = 1;
        let activeCategory = 'Semua';
        let searchQuery = '';
        let currentApps = [];
        let currentPages = [];
        let globalConfig = {};
        let isMarketplaceOpen = false;
        
        const ITEMS_PER_PAGE = 20;

        /**
         * FUNGSI UTAMA: BOOTSTRAP
         * Berjalan saat halaman pertama kali dimuat.
         */
        async function iMersEngineStart() {
            console.log("🚀 iMers Engine Initializing...");
            
            try {
                // 1. Fetch Seluruh Data Database
                const response = await fetch(`${SCRIPT_URL}?action=getData`);
                const data = await response.json();
                
                // 2. Simpan Data ke State
                globalConfig = data.config;
                currentApps = (data.apps || []).filter(function(a) {
                    return String(a.Visible || a.visible).toLowerCase() === 'true';
                });
                currentPages = (data.pages || []).filter(function(p) {
                    return String(p.visible).toLowerCase() === 'true';
                });

                // 3. Deploy Pixel Ads Tracking
                activateAdsTracking(globalConfig);
                
                // 4. Tutup Loading Spinner
                document.getElementById('loading-spinner').classList.add('hidden');

                // 5. Routing Check (?page=slug)
                const urlParams = new URLSearchParams(window.location.search);
                const activeSlug = urlParams.get('page');

                if (activeSlug) {
                    // Render Landing Page Saja
                    renderLandingPage(activeSlug);
                } else {
                    // Render Biolink Utama
                    renderProfile(data.config);
                    renderSocials(data.socials);
                    renderCategories(currentApps);
                    updateDisplay();

                    // Cek pengaturan visibilitas Marketplace & VIP
                    if (globalConfig.show_marketplace !== 'false' && currentPages.length > 0) {
                        document.getElementById('btn-marketplace').classList.remove('hidden');
                    }
                    if (globalConfig.show_vip_form !== 'false') {
                        document.getElementById('vip-list-section').classList.remove('hidden');
                    }
                    
                    const mainContent = document.getElementById('main-content');
                    mainContent.classList.remove('hidden');
                    setTimeout(function() {
                        mainContent.classList.remove('opacity-0');
                    }, 50);
                }

                // 6. Set Footer Statis
                document.getElementById('footer-name').innerText = globalConfig.profile_name || 'iMers Biopage';
                document.getElementById('footer-text').innerText = globalConfig.footer_text || 'Designed with Glassmorphism.';
                document.getElementById('year').innerText = new Date().getFullYear();
                
                // 7. Hidupkan Pencarian
                initSearchFeature();
                
            } catch (err) {
                console.error("❌ Gagal memuat database iMers:", err);
            }
        }

        /**
         * FUNGSI ADS TRACKING (PIXEL FB & TIKTOK)
         */
        function activateAdsTracking(cfg) {
            if (cfg.pixel_fb && cfg.pixel_fb.trim() !== '') {
                var fbId = cfg.pixel_fb.trim();
                !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
                n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
                n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
                t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
                document,'script','https://connect.facebook.net/en_US/fbevents.js');
                fbq('init', fbId); fbq('track', 'PageView');
                console.log("📡 FB Pixel Deployed.");
            }
            if (cfg.pixel_tiktok && cfg.pixel_tiktok.trim() !== '') {
                var ttId = cfg.pixel_tiktok.trim();
                !function (w, d, t) { w.TiktokAnalyticsObject=t;var ttq=w[t]=w[t]||[];ttq.methods=["page","track","identify","instances","debug","on","off","once","ready","alias","group","trackWithContext","setAndTrack"],ttq.setAndDefer=function(t,e){t[e]=function(){t.push([e].concat(Array.prototype.slice.call(arguments,0)))}},ttq.instance=function(t){for(var e=ttq._iq||{},n=0;n<ttq.methods.length;n++)ttq.setAndDefer(e,ttq.methods[n]);return e},ttq.load=function(e,n){var i="https://analytics.tiktok.com/i18n/pixel/events.js";ttq._i=ttq._i||{},ttq._i[e]=[],ttq._i[e]._u=i,ttq._t=ttq._t||{},ttq._t[e]=+new Date,ttq._o=ttq._o||{},ttq._o[e]=n||{};var o=document.createElement("script");o.type="text/javascript",o.async=!0,o.src=i+"?sdkid="+e+"&lib="+t;var a=d.getElementsByTagName("script")[0];a.parentNode.insertBefore(o,a)};ttq.load(ttId);ttq.page();}(window,document,'ttq');
                console.log("📡 TikTok Pixel Deployed.");
            }
        }

        /**
         * FUNGSI: RENDER LANDING PAGE VIEW (ZERO MARGIN)
         */
        function renderLandingPage(slug) {
            var page = currentPages.find(function(p) { return p.slug === slug; });
            if (page) {
                // Cek Password Halaman
                if (page.password && page.password.trim() !== '') {
                    openPasswordModal(page.slug, page.title, page.password_url);
                } else {
                    var container = document.getElementById('landing-page-content');
                    
                    // ============================================================
                    // ZERO MARGIN LOGIC: Menginjeksi konten sales iMers
                    // ============================================================
                    container.innerHTML = `
                        <!-- Latar belakang blur internal -->
                        <div class="absolute -top-10 -right-10 w-32 h-32 bg-purple-500/10 rounded-full blur-2xl pointer-events-none"></div>
                        <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-pink-500/10 rounded-full blur-2xl pointer-events-none"></div>
                        
                        <!-- Konten HTML Utama dari Sheets -->
                        <div class="relative z-10 w-full text-center">
                            ${page.html_content}
                        </div>`;
                    
                    document.getElementById('landing-page-view').classList.remove('hidden');
                    document.getElementById('main-content').classList.add('hidden');
                    document.title = page.title + " | iMers Biopage";
                    
                    // Catat Event View Page
                    sendRecordTracking('View Page', page.title, page.slug);
                }
            }
        }

        /**
         * FUNGSI: RENDER PROFIL
         */
        function renderProfile(c) {
            document.getElementById('profile-name').innerText = c.profile_name;
            document.getElementById('profile-title').innerText = c.profile_title;
            document.getElementById('profile-image').src = c.profile_image;
            if (String(c.verified_badge).toLowerCase() === 'true') {
                document.getElementById('verified-badge').classList.remove('hidden');
            }
        }

        /**
         * FUNGSI: RENDER SOSMED BAR
         */
        function renderSocials(socs) {
            var cont = document.getElementById('socials-container'); cont.innerHTML = '';
            socs.filter(function(s) { return String(s.Visible).toLowerCase() === 'true'; }).forEach(function(s, i) {
                var a = document.createElement('a'); a.href = s.Url; a.target = "_blank";
                a.className = `w-12 h-12 md:w-14 md:h-14 rounded-2xl glass glass-btn flex items-center justify-center text-xl shadow-lg hover:scale-110 transition-transform ${s.ColorClass}`;
                a.style.animationDelay = `${0.1 + (i * 0.05)}s`; a.innerHTML = `<i class="${s.IconClass}"></i>`;
                cont.appendChild(a);
            });
        }

        /**
         * FUNGSI: UPDATE DISPLAY (BIOLINK)
         */
        function updateDisplay() {
            var filtered = currentApps.filter(function(app) {
                var cats = (app.Category || '').split(',').map(function(c) { return c.trim(); });
                var matchSearch = (app.Name || '').toLowerCase().includes(searchQuery) || (app.Description || '').toLowerCase().includes(searchQuery);
                var matchCat = activeCategory === 'Semua' || cats.indexOf(activeCategory) !== -1;
                return matchSearch && matchCat;
            });
            
            var total = filtered.length;
            var paginated = filtered.slice((currentPage - 1) * ITEMS_PER_PAGE, currentPage * ITEMS_PER_PAGE);
            
            renderApps(paginated);
            renderPagination(total);
        }

        /**
         * FUNGSI: RENDER LIST APPS
         */
        function renderApps(apps) {
            var cont = document.getElementById('apps-container'); cont.innerHTML = '';
            apps.forEach(function(app, index) {
                var div = document.createElement('div'); div.className = 'w-full animate-stagger';
                div.style.animationDelay = `${0.1 + (index * 0.05)}s`;
                var type = (app.Type || 'link').toLowerCase();
                var isLocked = app.isLocked === true;
                
                if (type === 'hero') {
                    div.innerHTML = `<div class="text-center py-6"><img src="${app.LogoUrl}" class="h-16 mx-auto mb-4 rounded-full shadow-lg"><h2 class="text-2xl font-black tracking-tighter font-[Poppins]">${app.Name}</h2><p class="text-[11px] opacity-60 mt-1 uppercase tracking-widest px-10">${app.Description}</p></div>`;
                } else if (type === 'image') {
                    div.innerHTML = `<a href="${app.Url}" target="_blank" class="block glass rounded-3xl overflow-hidden tap-effect border-white/40 shadow-xl relative">${renderBadge(app)}<img src="${app.ImageUrl}" class="w-full h-auto object-cover"></a>`;
                } else if (type === 'pricing') {
                    div.innerHTML = `<div class="glass rounded-[2rem] p-6 text-center border-t-4 shadow-xl" style="border-top-color: ${app.BadgeColor1 || '#9333ea'}"><h3 class="text-lg font-black uppercase tracking-widest mb-4 font-[Poppins] ${app.ColorClass}">${app.Name}</h3><div class="text-sm opacity-80 mb-6 text-left whitespace-pre-line leading-relaxed">${app.Description}</div><a href="${app.Url}" target="_blank" class="block w-full py-4 rounded-xl font-black text-white shadow-lg tap-effect uppercase tracking-widest text-[11px]" style="background: linear-gradient(135deg, ${app.BadgeColor1 || '#9333ea'}, ${app.BadgeColor2 || '#ec4899'})">BELI SEKARANG</a></div>`;
                } else {
                    var clickCmd = isLocked ? `openPasswordModal('${app.ID}','${app.Name}','${app.PasswordSourceUrl}')` : `window.open('${app.Url}','_blank'); sendRecordTracking('Click','${app.Name}','${app.ID}')`;
                    div.innerHTML = `<div onclick="${clickCmd}" class="glass rounded-2xl p-4 flex items-center gap-4 tap-effect cursor-pointer group shadow-sm relative">${renderBadge(app)}<div class="w-12 h-12 rounded-xl glass-input flex items-center justify-center text-2xl ${app.ColorClass}"><i class="${isLocked ? 'fas fa-shield-halved' : (app.IconClass || 'fas fa-link')}"></i></div><div class="flex-1 min-w-0 text-left"><h4 class="font-bold text-sm truncate tracking-tight text-slate-700 dark:text-white">${app.Name}</h4><p class="text-[10px] opacity-40 uppercase tracking-widest truncate font-semibold">${app.Description}</p></div><i class="fas fa-chevron-right text-[10px] opacity-20 group-hover:opacity-100 transition-opacity pr-2 text-purple-600"></i></div>`;
                }
                cont.appendChild(div);
            });
        }

        function renderBadge(app) { if (!app.BadgeText) return ''; return `<div class="absolute top-0 right-0 rounded-bl-xl rounded-tr-xl px-3 py-1 text-[10px] font-black uppercase text-white shadow-lg z-10" style="background: linear-gradient(135deg, ${app.BadgeColor1 || '#ec4899'}, ${app.BadgeColor2 || '#8b5cf6'})">${app.BadgeText}</div>`; }
        function renderCategories(apps) { var cont = document.getElementById('category-container'); var uniqueCats = ['Semua', ...new Set(apps.flatMap(function(a) { return (a.Category || '').split(',').map(function(c) { return c.trim(); }); }).filter(Boolean))]; cont.innerHTML = uniqueCats.map(function(cat) { var active = cat === 'Semua' ? 'glass-active' : ''; return `<button onclick="filterCategory('${cat}')" class="px-5 py-2.5 rounded-2xl text-[11px] font-black uppercase tracking-widest glass glass-btn shadow-md ${active}">${cat}</button>`; }).join(''); }
        window.filterCategory = function(cat) { activeCategory = cat; currentPage = 1; document.querySelectorAll('#category-container button').forEach(function(b) { b.classList.remove('glass-active'); }); event.target.classList.add('glass-active'); updateDisplay(); };

        /**
         * FUNGSI UTILITAS (ROUTING & UI)
         */
        function goBackHome() { var url = new URL(window.location); url.searchParams.delete('page'); window.history.pushState({}, document.title, url); window.location.reload(); }
        function toggleMarketplace() { isMarketplaceOpen = !isMarketplaceOpen; document.getElementById('apps-container').classList.toggle('hidden', isMarketplaceOpen); document.getElementById('cat-wrapper').classList.toggle('hidden', isMarketplaceOpen); document.getElementById('marketplace-container').classList.toggle('hidden', !isMarketplaceOpen); if (isMarketplaceOpen) renderMarketplace(); }
        function renderMarketplace() { var cont = document.getElementById('marketplace-container'); cont.innerHTML = currentPages.map(function(p) { return `<div onclick="window.location.href='?page=${p.slug}'" class="glass rounded-2xl overflow-hidden tap-effect cursor-pointer group shadow-xl h-full flex flex-col"><div class="h-32 bg-gray-200 relative overflow-hidden"><img src="${p.thumbnail}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700"></div><div class="p-3 bg-white/40 flex-grow flex items-center justify-center"><h4 class="font-black text-[9px] uppercase tracking-widest leading-tight text-center">${p.title}</h4></div></div>`; }).join(''); }

        function openPasswordModal(id, name, passUrl) { document.getElementById('locked-app-id').value = id; document.getElementById('password-modal').classList.remove('hidden'); var btnSandi = document.getElementById('get-password-btn'); if (passUrl) { btnSandi.href = passUrl; btnSandi.classList.remove('hidden'); } else { btnSandi.classList.add('hidden'); } setTimeout(function() { document.getElementById('password-modal-content').classList.remove('scale-95', 'opacity-0'); }, 10); }
        function closePasswordModal() { document.getElementById('password-modal-content').classList.add('scale-95', 'opacity-0'); setTimeout(function() { document.getElementById('password-modal').classList.add('hidden'); }, 300); }
        
        document.getElementById('password-form').onsubmit = async function(e) { e.preventDefault(); var id = document.getElementById('locked-app-id').value; var pass = document.getElementById('app-password').value; var resp = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'verifyPassword', appId: id, password: pass }) }); var res = await resp.json(); if (res.success) { closePasswordModal(); if (res.url === 'locked_page_content') renderLandingPage(id); else window.open(res.url, '_blank'); } else { document.getElementById('password-error').innerText = res.message; document.getElementById('password-error').classList.remove('hidden'); } };

        async function sendRecordTracking(type, name, id) { try { fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'recordTracking', type, productName: name, targetId: id }) }); if (typeof fbq !== 'undefined') fbq('track', 'AddToCart', { content_name: name }); } catch(e) {} }
        
        async function handleLeadSubmit(e) { e.preventDefault(); var btn = document.getElementById('lead-submit-btn'); var msg = document.getElementById('lead-msg'); var original = btn.innerText; btn.disabled = true; btn.innerText = "MEMPROSES DATA..."; try { const resp = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'addLead', name: document.getElementById('lead-name').value, email: document.getElementById('lead-email').value, wa: document.getElementById('lead-wa').value }) }); const res = await resp.json(); if (res.success) { msg.innerText = "TERIMA KASIH! AKSES VIP TERKIRIM! ✨"; msg.className = "text-[10px] text-center font-black text-green-500 block uppercase tracking-widest mt-4"; if (globalConfig.vip_redirect_url) setTimeout(function() { window.open(globalConfig.vip_redirect_url, '_blank'); }, 1500); } } catch(e) { msg.innerText = "GAGAL MENGIRIM. COBA LAGI!"; msg.className = "text-[10px] text-center font-black text-red-500 block uppercase tracking-widest mt-4"; } finally { btn.disabled = false; btn.innerText = original; } }

        function renderPagination(total) { var cont = document.getElementById('pagination-container'); var pages = Math.ceil(total / ITEMS_PER_PAGE); if (pages <= 1) { cont.innerHTML = ''; return; } var html = ''; for (var i = 1; i <= pages; i++) { var active = currentPage === i ? 'glass-active text-purple-600' : 'opacity-40'; html += `<button onclick="currentPage=${i};updateDisplay();window.scrollTo({top:0,behavior:'smooth'})" class="w-10 h-10 rounded-xl glass font-black text-xs transition-all ${active}">${i}</button>`; } cont.innerHTML = html; }
        function initSearchFeature() { document.getElementById('app-search').addEventListener('input', function(e) { searchQuery = e.target.value.toLowerCase(); currentPage = 1; updateDisplay(); }); }
        function toggleTheme() { document.documentElement.classList.toggle('dark'); localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light'; }
        
        function shareProfile() { if (navigator.share) { navigator.share({ title: document.title, url: window.location.href }); } else { var el = document.createElement('textarea'); el.value = window.location.href; document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el); var toast = document.getElementById('toast'); toast.classList.remove('opacity-0', 'pointer-events-none'); setTimeout(function() { toast.classList.add('opacity-0', 'pointer-events-none'); }, 3000); } }

        // Start mesin iMers
        iMersEngineStart();
    </script>
</body>
</html>
