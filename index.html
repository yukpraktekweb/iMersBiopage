<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iMersBiopage - Smart Landing Page</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://ui-avatars.com/api/?name=iMersBiopage&background=7c3aed&color=fff&size=32">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;900&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['"Outfit"', 'sans-serif'] 
                    },
                    animation: { 
                        blob: "blob 7s infinite", 
                        pulseGlow: "pulseGlow 2s infinite" 
                    },
                    keyframes: {
                        blob: {
                            "0%": { transform: "translate(0px, 0px) scale(1)" },
                            "33%": { transform: "translate(30px, -50px) scale(1.1)" },
                            "66%": { transform: "translate(-20px, 20px) scale(0.9)" },
                            "100%": { transform: "translate(0px, 0px) scale(1)" }
                        },
                        pulseGlow: { 
                            "0%, 100%": { opacity: 1, transform: "scale(1)" }, 
                            "50%": { opacity: .9, transform: "scale(1.02)" } 
                        }
                    }
                }
            }
        }
    </script>

    <!-- GLASSMORPHISM CSS -->
    <style>
        body { 
            font-family: 'Outfit', sans-serif; 
            background-color: #f3f4f6; 
            color: #1f2937; 
            transition: background-color 0.4s ease, color 0.4s ease; 
        }
        .dark body { 
            background-color: #111827; 
            color: #f9fafb; 
        }
        .glass { 
            background: rgba(255, 255, 255, 0.4); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px); 
            border: 1px solid rgba(255, 255, 255, 0.6); 
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1); 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .dark .glass { 
            background: rgba(17, 24, 39, 0.6); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3); 
        }
        .glass-btn:hover, .glass-card:hover { 
            background: rgba(255, 255, 255, 0.6); 
            transform: translateY(-3px); 
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.15); 
            border: 1px solid rgba(255, 255, 255, 0.8); 
        }
        .dark .glass-btn:hover, .dark .glass-card:hover { 
            background: rgba(31, 41, 55, 0.8); 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); 
        }
        .glass-input { 
            background: rgba(255, 255, 255, 0.3); 
            backdrop-filter: blur(8px); 
            border: 1px solid rgba(255, 255, 255, 0.5); 
        }
        .dark .glass-input { 
            background: rgba(0, 0, 0, 0.3); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
        }
        .glass-active { 
            background: rgba(255, 255, 255, 0.8) !important; 
            border-color: rgba(255, 255, 255, 1) !important; 
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5); 
        }
        .dark .glass-active { 
            background: rgba(59, 130, 246, 0.5) !important; 
            border-color: rgba(96, 165, 250, 0.8) !important; 
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3); 
        }
        @keyframes fadeSlideUp { 
            0% { opacity: 0; transform: translateY(20px); } 
            100% { opacity: 1; transform: translateY(0); } 
        }
        .animate-stagger { 
            opacity: 0; 
            animation: fadeSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
            will-change: transform, opacity; 
        }
        .tap-effect { 
            transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .tap-effect:active { 
            transform: scale(0.96) !important; 
        }
        ::-webkit-scrollbar { 
            width: 0px; 
            height: 0px; 
        }
        .fade-mask { 
            mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent); 
            -webkit-mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent); 
        }
        input::placeholder, textarea::placeholder { 
            color: inherit; 
            opacity: 0.6; 
        }
        .pricing-list ul { 
            padding-left: 0.5rem; 
            margin-bottom: 1.5rem; 
            text-align: left; 
        }
        .pricing-list li { 
            margin-bottom: 0.5rem; 
            display: flex; 
            align-items: flex-start; 
            gap: 0.5rem; 
        }

        /* PERBAIKAN ZERO MARGIN: Biar konten di dalem box nempel mentok */
        /* Teknik negative margin untuk nabrak padding container utama */
        #landing-page-content {
            padding: 1.5rem !important; /* Mobile padding */
        }
        @media (min-width: 768px) {
            #landing-page-content {
                padding: 2rem !important; /* Desktop padding */
            }
        }
    </style>

    <script>
        // Load Theme Preference
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>
<body class="min-h-screen flex flex-col items-center p-4 relative overflow-x-hidden selection:bg-purple-500/30">

    <!-- Background Blobs -->
    <div class="fixed inset-0 w-full h-full -z-10 overflow-hidden pointer-events-none" id="bg-blobs">
        <div class="absolute top-[-10%] left-[-10%] w-72 h-72 md:w-96 md:h-96 bg-purple-400 dark:bg-purple-800 rounded-full mix-blend-multiply filter blur-3xl opacity-50 dark:opacity-40 animate-blob"></div>
        <div class="absolute top-[20%] right-[-10%] w-72 h-72 md:w-96 md:h-96 bg-cyan-300 dark:bg-blue-800 rounded-full mix-blend-multiply filter blur-3xl opacity-50 dark:opacity-40 animate-blob" style="animation-delay: 2s"></div>
        <div class="absolute bottom-[-10%] left-[20%] w-72 h-72 md:w-96 md:h-96 bg-pink-300 dark:bg-rose-800 rounded-full mix-blend-multiply filter blur-3xl opacity-50 dark:opacity-40 animate-blob" style="animation-delay: 4s"></div>
    </div>

    <!-- Theme Toggle -->
    <div class="absolute top-6 right-6 z-50">
        <button onclick="toggleTheme()" class="w-12 h-12 rounded-full glass glass-btn flex items-center justify-center text-lg focus:outline-none shadow-sm">
            <i class="fas fa-sun hidden dark:block text-yellow-300"></i>
            <i class="fas fa-moon block dark:hidden text-indigo-700"></i>
        </button>
    </div>

    <!-- Loading Spinner Keren -->
    <div id="loading-spinner" class="fixed inset-0 flex flex-col items-center justify-center z-[100] backdrop-blur-xl bg-white/40 dark:bg-black/60 transition-opacity duration-500 p-4">
        <div class="relative w-24 h-24 flex items-center justify-center mb-6">
            <div class="absolute inset-0 rounded-full border-t-4 border-b-4 border-purple-500 animate-spin opacity-80"></div>
            <div class="absolute inset-2 rounded-full border-r-4 border-l-4 border-pink-500 animate-spin opacity-80" style="animation-direction: reverse; animation-duration: 1.2s;"></div>
            <div class="w-12 h-12 glass rounded-full flex items-center justify-center shadow-inner">
                <i class="fas fa-rocket text-purple-600 dark:text-purple-400 text-xl animate-pulse"></i>
            </div>
        </div>
        <div class="glass px-8 py-5 rounded-[2rem] text-center border border-white/50 shadow-2xl w-full max-w-sm animate-stagger">
            <h3 class="text-xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-pink-500 mb-2 font-[Poppins]">Memuat iMers Biopage...</h3>
            <p class="text-xs font-medium opacity-80 leading-relaxed text-gray-700 dark:text-gray-200">Sedang mengambil data terbaru dari Google Sheets 🚀</p>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- VIEW 1: LANDING PAGE ROUTER (FULL HTML)    -->
    <!-- ========================================== -->
    <div id="landing-page-view" class="w-full max-w-md mx-auto relative z-10 hidden pt-6 pb-12 px-2 animate-stagger">
        <button onclick="goBackHome()" class="glass glass-btn tap-effect px-5 py-2.5 rounded-xl text-xs font-bold mb-6 flex items-center gap-2 shadow-sm border border-white/50 w-max mx-auto">
            <i class="fas fa-arrow-left"></i> Kembali ke Menu
        </button>
        
        <!-- Box Landing Page bergaya Kartu VIP (Zero Margin Supported) -->
        <div id="landing-page-content" class="glass glass-card rounded-[2rem] text-center relative overflow-hidden border border-white/50 shadow-2xl w-full">
            <!-- Konten di-inject dari Sheets via renderLandingPage() -->
        </div>
    </div>

    <!-- ========================================== -->
    <!-- VIEW 2: BIOLINK & MARKETPLACE HOME         -->
    <!-- ========================================== -->
    <main id="main-content" class="w-full max-w-md mx-auto relative z-10 hidden pt-12 pb-8 opacity-0 transition-opacity duration-700">
        
        <!-- Profile Section -->
        <div id="profile-section" class="flex flex-col items-center mb-8 text-center px-4 w-full animate-stagger">
            <div class="glass rounded-[2.5rem] p-2 mb-4 relative shadow-lg">
                <img id="profile-image" src="" alt="Profile" class="w-28 h-28 md:w-32 md:h-32 rounded-[2.3rem] object-cover border-2 border-white/20">
                <div id="verified-badge" class="absolute -bottom-1 -right-1 w-8 h-8 rounded-full glass flex items-center justify-center hidden text-blue-500 bg-white border border-white/50 shadow-md">
                    <i class="fas fa-check text-xs"></i>
                </div>
            </div>
            <h1 id="profile-name" class="text-3xl font-black tracking-tight font-[Poppins]">...</h1>
            <p id="profile-title" class="opacity-70 font-semibold mt-1 text-xs uppercase tracking-widest px-8">...</p>
            <div id="socials-container" class="flex flex-wrap justify-center gap-4 mt-8"></div>
        </div>

        <div class="space-y-6 px-4 w-full animate-stagger" style="animation-delay: 0.1s">
            <!-- Category Tabs -->
            <div class="w-full fade-mask" id="cat-wrapper">
                <div id="category-container" class="flex gap-3 w-full overflow-x-auto pb-4 pt-2 snap-x"></div>
            </div>

            <!-- Search & Marketplace Button -->
            <div class="w-full">
                <div class="glass-input rounded-2xl flex items-center px-5 py-4 shadow-inner mb-3">
                    <i class="fas fa-search opacity-50 mr-3"></i>
                    <input type="text" id="app-search" class="w-full bg-transparent outline-none text-sm font-medium" placeholder="Cari konten iMers...">
                </div>
                <button onclick="toggleMarketplace()" id="btn-marketplace" class="w-full glass tap-effect rounded-2xl py-4 font-black text-xs flex justify-center items-center gap-3 border-dashed border-2 border-purple-200 dark:border-purple-800 text-purple-600 dark:text-purple-400 uppercase tracking-widest hidden">
                    <i class="fas fa-th-large"></i> Katalog Halaman Sales
                </button>
            </div>

            <!-- Apps Container -->
            <div id="apps-container" class="grid grid-cols-1 gap-4 pt-2"></div>
            
            <!-- Marketplace Container -->
            <div id="marketplace-container" class="hidden grid grid-cols-2 gap-4 pt-2"></div>

            <!-- Pagination -->
            <div id="pagination-container" class="flex justify-center items-center gap-2 mt-8 mb-4"></div>

        <!-- VIP List Section -->
        <div id="vip-list-section" class="mt-12 px-4 w-full animate-stagger hidden">
            <div class="glass glass-card rounded-[2rem] p-8 text-center relative overflow-hidden border border-white/50 shadow-xl">

                    <input type="tel" id="lead-wa" placeholder="Nomor WhatsApp" required class="w-full glass-input rounded-xl px-5 py-4 text-sm font-bold outline-none focus:ring-2 focus:ring-purple-400 transition-all">

                <i class="fas fa-share-nodes"></i> Bagikan Link iMers
            </button>
        </div>
        <footer class="text-center mt-10 pb-8 opacity-40">
            <p class="text-[9px] font-black uppercase tracking-[0.3em]"><span id="footer-name"></span> © <span id="year"></span>. <span id="footer-text"></span></p>
        </footer>
    </main>

    <!-- Password Modal -->
    <div id="password-modal" class="fixed inset-0 hidden z-[200] flex items-center justify-center p-4 bg-gray-900/40 backdrop-blur-xl transition-all">
        <div class="glass rounded-[3rem] border border-white/50 w-full max-w-sm p-10 transform scale-95 opacity-0 transition-all" id="password-modal-content">
            <div class="text-center mb-8">
                <div class="w-20 h-20 rounded-[2rem] glass flex items-center justify-center mx-auto mb-6 text-purple-600 shadow-inner">
                    <i class="fas fa-lock-open text-3xl"></i>
                </div>
                <h3 class="text-2xl font-black tracking-tight">Area Terkunci</h3>
                <p class="text-sm opacity-50 mt-2 px-4">Konten ini dilindungi sandi. Masukkan sandi akses untuk membukanya.</p>
            </div>
            <form id="password-form" class="space-y-6">
                <input type="hidden" id="locked-app-id">
                <input type="password" id="app-password" placeholder="PASSWORD..." class="w-full glass-input rounded-2xl px-6 py-5 text-center tracking-[0.5em] font-black text-xl outline-none focus:ring-4 focus:ring-purple-400/20" required>
                <p id="password-error" class="text-red-500 text-[10px] text-center hidden font-black uppercase tracking-widest"></p>
                <div class="flex gap-4">
                    <button type="button" onclick="closePasswordModal()" class="flex-1 glass glass-btn py-4 rounded-2xl font-black text-[11px] uppercase">Batal</button>
                    <button type="submit" id="unlock-btn" class="flex-1 glass glass-btn py-4 rounded-2xl font-black text-[11px] uppercase text-purple-600 bg-white shadow-xl">Buka</button>
                </div>
            </form>
        </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 glass rounded-full px-8 py-4 opacity-0 transition-all pointer-events-none z-[300] flex items-center gap-3 shadow-2xl">
        <i class="fas fa-check-circle text-green-500"></i>
        <span class="text-xs font-black uppercase tracking-widest">Link Berhasil Disalin!</span>
    </div>

    <!-- MAIN LOGIC (SCRIPT ENGINE) -->
    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxOOuq8euMjbH-XNkjqdBASmj_a1qvK4DP5SiHotX_mEOspwvybUuUdFwUibl8N4r6Olw/exec';
        
        let currentPage = 1;
        let activeCategory = 'Semua';
        let searchQuery = '';
        let currentApps = [];
        let currentPages = [];
        let globalConfig = {};
        let isMarketplaceOpen = false;
        const ITEMS_PER_PAGE = 20;

        // --- FETCH & PIXEL ENGINE ---
        async function init() {
            try {
                const response = await fetch(`${SCRIPT_URL}?action=getData`);
                const data = await response.json();
                
                globalConfig = data.config;
                currentApps = (data.apps || []).filter(a => String(a.Visible).toLowerCase() === 'true');
                currentPages = (data.pages || []).filter(p => String(p.visible).toLowerCase() === 'true');

                // Injeksi Pixel Facebook & TikTok
                injectPixels(globalConfig);
                
                document.getElementById('loading-spinner').classList.add('hidden');

                const urlParams = new URLSearchParams(window.location.search);
                const activeSlug = urlParams.get('page');

                if (activeSlug) {
                    renderLandingPage(activeSlug);
                } else {
                    renderProfile(data.config);
                    renderSocials(data.socials);
                    renderCategories(currentApps);
                    updateDisplay();

                    if (globalConfig.show_marketplace !== 'false' && currentPages.length > 0) {
                        document.getElementById('btn-marketplace').classList.remove('hidden');
                    }
                    if (globalConfig.show_vip_form !== 'false') {
                        document.getElementById('vip-list-section').classList.remove('hidden');
                    }
                    
                    const mainContent = document.getElementById('main-content');
                    mainContent.classList.remove('hidden');
                    setTimeout(() => mainContent.classList.remove('opacity-0'), 50);
                }

                document.getElementById('footer-name').innerText = globalConfig.profile_name || 'iMers Biopage';
                document.getElementById('footer-text').innerText = globalConfig.footer_text || '';
                document.getElementById('year').innerText = new Date().getFullYear();
                
                setupSearch();
            } catch (error) {
                console.error("Engine failure:", error);
            }
        }

        function injectPixels(cfg) {
            if (cfg.pixel_fb) {
                !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
                fbq('init', cfg.pixel_fb); fbq('track', 'PageView');
                console.log("FB Pixel Active");
            }
            if (cfg.pixel_tiktok) {
                !function(w,d,t){w.TiktokAnalyticsObject=t;var ttq=w[t]=w[t]||[];ttq.methods=["page","track","identify","instances","debug","on","off","once","ready","alias","group","trackWithContext","setAndTrack"],ttq.instance=function(t){for(var e=ttq._instances[t]||[],n=0;n<ttq.methods.length;n++)ttq.set(e,ttq.methods[n]);return e},ttq.load=function(e,n){var i="https://analytics.tiktok.com/i18n/pixel/events.js";ttq._i=ttq._i||{},ttq._i[e]=[],ttq._i[e]._u=i,ttq._t=ttq._t||{},ttq._t[e]=+new Date,ttq._instances=ttq._instances||{},ttq._instances[t]=ttq.instance(t),ttq._flex=ttq._flex||{},ttq._flex.p=ttq._flex.p||{};var o=d.createElement("script");o.type="text/javascript",o.async=!0,o.src=i+"?sdkid="+e+"&lib="+t;var a=d.getElementsByTagName("script")[0];a.parentNode.insertBefore(o,a)};ttq.load(cfg.pixel_tiktok);ttq.page();}(window,document,'ttq');
                console.log("TikTok Pixel Active");
            }
        }

        // --- RENDER UI ---
        function renderProfile(c) {
            document.getElementById('profile-name').innerText = c.profile_name;
            document.getElementById('profile-title').innerText = c.profile_title;
            document.getElementById('profile-image').src = c.profile_image;
            if (String(c.verified_badge).toLowerCase() === 'true') {
                document.getElementById('verified-badge').classList.remove('hidden');
            }
        }

        function renderSocials(socs) {
            const container = document.getElementById('socials-container');
            container.innerHTML = '';
            socs.filter(s => String(s.Visible).toLowerCase() === 'true').forEach((s, i) => {
                const a = document.createElement('a');
                a.href = s.Url; a.target = "_blank";
                a.className = `w-12 h-12 md:w-14 md:h-14 rounded-2xl glass glass-btn flex items-center justify-center text-xl shadow-lg hover:scale-110 transition-transform ${s.ColorClass}`;
                a.style.animationDelay = `${0.1 + (i * 0.05)}s`;
                a.innerHTML = `<i class="${s.IconClass}"></i>`;
                container.appendChild(a);
            });
        }

        function updateDisplay() {
            let filtered = currentApps.filter(app => {
                const cats = (app.Category || '').split(',').map(c => c.trim());
                const matchSearch = (app.Name || '').toLowerCase().includes(searchQuery) || (app.Description || '').toLowerCase().includes(searchQuery);
                const matchCat = activeCategory === 'Semua' || cats.includes(activeCategory);
                return matchSearch && matchCat;
            });
            
            const total = filtered.length;
            const paginated = filtered.slice((currentPage - 1) * ITEMS_PER_PAGE, currentPage * ITEMS_PER_PAGE);
            
            renderApps(paginated);
            renderPagination(total);
        }

        function renderApps(apps) {
            const container = document.getElementById('apps-container');
            container.innerHTML = '';
            apps.forEach((app, index) => {
                const div = document.createElement('div');
                div.className = 'w-full animate-stagger';
                div.style.animationDelay = `${0.1 + (index * 0.05)}s`;

                const type = (app.Type || 'link').toLowerCase();
                const isLocked = app.isLocked === true;

                if (type === 'hero') {
                    div.innerHTML = `
                        <div class="text-center py-6">
                            <img src="${app.LogoUrl}" class="h-16 mx-auto mb-4 rounded-full shadow-lg">
                            <h2 class="text-2xl font-black tracking-tighter">${app.Name}</h2>
                            <p class="text-[11px] opacity-60 mt-1 uppercase tracking-widest px-10">${app.Description}</p>
                        </div>`;
                } else if (type === 'image') {
                    div.innerHTML = `
                        <a href="${app.Url}" target="_blank" class="block glass rounded-3xl overflow-hidden tap-effect border-white/40 shadow-xl relative">
                            ${renderBadge(app)}
                            <img src="${app.ImageUrl}" class="w-full h-auto object-cover">
                        </a>`;
                } else if (type === 'pricing') {
                    div.innerHTML = `
                        <div class="glass rounded-[2rem] p-6 text-center border-t-4 shadow-xl" style="border-top-color: ${app.BadgeColor1 || '#9333ea'}">
                            <h3 class="text-lg font-black uppercase tracking-widest mb-4 ${app.ColorClass}">${app.Name}</h3>
                            <div class="text-sm opacity-80 mb-6 text-left whitespace-pre-line">${app.Description}</div>
                            <a href="${app.Url}" target="_blank" class="block w-full py-4 rounded-xl font-black text-white shadow-lg tap-effect" style="background: linear-gradient(135deg, ${app.BadgeColor1 || '#9333ea'}, ${app.BadgeColor2 || '#ec4899'})">BELI SEKARANG</a>
                        </div>`;
                } else {
                    div.innerHTML = `
                        <div onclick="${isLocked ? `openPasswordModal('${app.ID}','${app.Name}')` : `window.open('${app.Url}','_blank'); sendTracking('Click','${app.Name}','${app.ID}')`}" class="glass rounded-2xl p-4 flex items-center gap-4 tap-effect cursor-pointer group shadow-sm relative">
                            ${renderBadge(app)}
                            <div class="w-12 h-12 rounded-xl glass-input flex items-center justify-center text-2xl ${app.ColorClass}">
                                <i class="${isLocked ? 'fas fa-lock' : (app.IconClass || 'fas fa-link')}"></i>
                            </div>
                            <div class="flex-1 min-w-0">
                                <h4 class="font-bold text-sm truncate">${app.Name}</h4>
                                <p class="text-[10px] opacity-40 uppercase tracking-widest truncate font-semibold">${app.Description}</p>
                            </div>
                            <i class="fas fa-chevron-right text-[10px] opacity-20 group-hover:opacity-100 transition-opacity pr-2"></i>
                        </div>`;
                }
                container.appendChild(div);
            });
        }

        function renderBadge(app) {
            if (!app.BadgeText) return '';
            return `<div class="absolute top-2 right-2 rounded-bl-xl rounded-tr-xl px-3 py-1 text-[10px] font-black uppercase text-white shadow-lg z-10" style="background: linear-gradient(135deg, ${app.BadgeColor1 || '#ec4899'}, ${app.BadgeColor2 || '#8b5cf6'})">${app.BadgeText}</div>`;
        }

        function renderCategories(apps) {
            const container = document.getElementById('category-container');
            const uniqueCats = ['Semua', ...new Set(apps.flatMap(a => (a.Category || '').split(',').map(c => c.trim())).filter(Boolean))];
            container.innerHTML = uniqueCats.map(cat => `<button onclick="filterCategory('${cat}')" class="px-5 py-2.5 rounded-2xl text-[11px] font-black uppercase tracking-widest glass glass-btn ${cat === 'Semua' ? 'glass-active' : ''}">${cat}</button>`).join('');
        }

        window.filterCategory = (cat) => {
            activeCategory = cat; currentPage = 1;
            document.querySelectorAll('#category-container button').forEach(b => b.classList.remove('glass-active'));
            event.target.classList.add('glass-active');
            updateDisplay();
        };

        // --- LANDING PAGE ENGINE ---
        function renderLandingPage(slug) {
            const page = currentPages.find(p => p.slug === slug);
            if (page) {
                if (page.password) {
                    openPasswordModal(page.slug, page.title);
                } else {
                    document.getElementById('landing-page-content').innerHTML = page.html_content;
                    document.getElementById('landing-page-view').classList.remove('hidden');
                    document.getElementById('main-content').classList.add('hidden');
                    document.title = page.title;
                    sendTracking('View Page', page.title, page.slug);
                }
            }
        }

        function goBackHome() {
            const url = new URL(window.location);
            url.searchParams.delete('page');
            window.history.pushState({}, '', url);
            window.location.reload();
        }

        function toggleMarketplace() {
            isMarketplaceOpen = !isMarketplaceOpen;
            document.getElementById('apps-container').classList.toggle('hidden', isMarketplaceOpen);
            document.getElementById('cat-wrapper').classList.toggle('hidden', isMarketplaceOpen);
            document.getElementById('marketplace-container').classList.toggle('hidden', !isMarketplaceOpen);
            if (isMarketplaceOpen) renderMarketplace();
        }

        function renderMarketplace() {
            const cont = document.getElementById('marketplace-container');
            cont.innerHTML = currentPages.map(p => `
                <div onclick="window.location.href='?page=${p.slug}'" class="glass rounded-2xl overflow-hidden tap-effect cursor-pointer group shadow-xl">
                    <div class="h-32 bg-gray-200 relative overflow-hidden"><img src="${p.thumbnail}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500"></div>
                    <div class="p-3 bg-white/40"><h4 class="font-bold text-[10px] uppercase tracking-widest truncate">${p.title}</h4></div>
                </div>`).join('');
        }

        // --- AUTH & TRACKING ---
        function openPasswordModal(id, name) {
            document.getElementById('locked-app-id').value = id;
            document.getElementById('password-modal').classList.remove('hidden');
            setTimeout(() => {
                document.getElementById('password-modal-content').classList.remove('scale-95', 'opacity-0');
            }, 10);
        }

        function closePasswordModal() {
            document.getElementById('password-modal-content').classList.add('scale-95', 'opacity-0');
            setTimeout(() => document.getElementById('password-modal').classList.add('hidden'), 300);
        }

        document.getElementById('password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('locked-app-id').value;
            const pass = document.getElementById('app-password').value;
            const resp = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'verifyPassword', appId: id, password: pass }) });
            const res = await resp.json();
            if (res.success) {
                closePasswordModal();
                if (res.url === 'locked_page_content') renderLandingPage(id);
                else window.open(res.url, '_blank');
            } else {
                const err = document.getElementById('password-error');
                err.innerText = res.message; err.classList.remove('hidden');
            }
        });

        async function sendTracking(type, name, id) {
            try {
                fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'recordTracking', type, productName: name, targetId: id }) });
                if (typeof fbq !== 'undefined') fbq('track', 'AddToCart', { content_name: name });
            } catch(e) {}
        }

        async function submitLeadForm(e) {
            e.preventDefault();
            const btn = document.getElementById('lead-submit-btn');
            const msg = document.getElementById('lead-msg');
            btn.disabled = true; btn.innerText = "MEMPROSES...";
            try {
                const resp = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'addLead', name: document.getElementById('lead-name').value, email: document.getElementById('lead-email').value, wa: document.getElementById('lead-wa').value }) });
                const res = await resp.json();
                if (res.success) {
                    msg.innerText = "BERHASIL BERLANGGANAN! ✨"; msg.className = "text-[10px] text-center font-black text-green-500 block";
                    if (globalConfig.vip_redirect_url) setTimeout(() => window.open(globalConfig.vip_redirect_url, '_blank'), 1500);
                }
            } catch(e) { msg.innerText = "GAGAL. COBA LAGI."; msg.className = "text-[10px] text-center font-black text-red-500 block"; }
            finally { btn.disabled = false; btn.innerText = "BERLANGGANAN SEKARANG"; }
        }

        // --- HELPERS ---
        function renderPagination(total) {
            const cont = document.getElementById('pagination-container');
            const pages = Math.ceil(total / ITEMS_PER_PAGE);
            if (pages <= 1) { cont.innerHTML = ''; return; }
            let html = '';
            for (let i = 1; i <= pages; i++) {
                html += `<button onclick="currentPage=${i};updateDisplay();window.scrollTo({top:0,behavior:'smooth'})" class="w-8 h-8 rounded-lg glass font-bold text-xs ${currentPage===i ? 'glass-active text-purple-600' : ''}">${i}</button>`;
            }
            cont.innerHTML = html;
        }

        function setupSearch() {
            document.getElementById('app-search').addEventListener('input', (e) => {
                searchQuery = e.target.value.toLowerCase(); updateDisplay();
            });
        }

        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
        }

        function shareProfile() {
            if (navigator.share) {
                navigator.share({ title: document.title, url: window.location.href });
            } else {
                const el = document.createElement('textarea'); el.value = window.location.href; document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el);
                const toast = document.getElementById('toast'); toast.classList.remove('opacity-0', 'pointer-events-none');
                setTimeout(() => toast.classList.add('opacity-0', 'pointer-events-none'), 3000);
            }
        }

        init();
    </script>
</body>
</html>
