<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iMersBiopage - Link in Bio</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://ui-avatars.com/api/?name=iMersBiopage&background=7c3aed&color=fff&size=32">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Outfit"', 'sans-serif'],
                    },
                    animation: {
                        blob: "blob 7s infinite",
                    },
                    keyframes: {
                        blob: {
                            "0%": { transform: "translate(0px, 0px) scale(1)" },
                            "33%": { transform: "translate(30px, -50px) scale(1.1)" },
                            "66%": { transform: "translate(-20px, 20px) scale(0.9)" },
                            "100%": { transform: "translate(0px, 0px) scale(1)" }
                        }
                    }
                }
            }
        }
    </script>

    <!-- GLASSMORPHISM CSS -->
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        .dark body {
            background-color: #111827;
            color: #f9fafb;
        }

        /* Glass Panel Styling */
        .glass {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .dark .glass {
            background: rgba(17, 24, 39, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        /* Interactive Glass Elements */
        .glass-btn:hover, .glass-card:hover {
            background: rgba(255, 255, 255, 0.6);
            transform: translateY(-3px);
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .dark .glass-btn:hover, .dark .glass-card:hover {
            background: rgba(31, 41, 55, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .dark .glass-input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Active Category Tab */
        .glass-active {
            background: rgba(255, 255, 255, 0.8) !important;
            border-color: rgba(255, 255, 255, 1) !important;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }

        .dark .glass-active {
            background: rgba(59, 130, 246, 0.5) !important;
            border-color: rgba(96, 165, 250, 0.8) !important;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
        }

        /* --- New Smooth & Lightweight Animations --- */
        @keyframes fadeSlideUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        
        .animate-stagger {
            opacity: 0;
            animation: fadeSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            will-change: transform, opacity; /* Optimasi GPU */
        }
        
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        
        /* Tactile tap effect (sangat ringan, efek fisik saat ditekan) */
        .tap-effect { transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1); }
        .tap-effect:active { transform: scale(0.96) !important; }

        /* Utils */
        ::-webkit-scrollbar { width: 0px; height: 0px; }
        
        .fade-mask {
            mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent);
            -webkit-mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent);
        }
        
        .animation-delay-2000 { animation-delay: 2s; }
        .animation-delay-4000 { animation-delay: 4s; }

        input::placeholder { color: inherit; opacity: 0.6; }
    </style>

    <script>
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
        } else {
            document.documentElement.classList.remove('dark')
        }
    </script>
</head>
<body class="min-h-screen flex flex-col items-center p-4 relative overflow-x-hidden selection:bg-purple-500/30">

    <!-- Animated Background Blobs for Glass Effect -->
    <div class="fixed inset-0 w-full h-full -z-10 overflow-hidden pointer-events-none">
        <!-- Pink/Purple Blob -->
        <div class="absolute top-[-10%] left-[-10%] w-72 h-72 md:w-96 md:h-96 bg-purple-400 dark:bg-purple-800 rounded-full mix-blend-multiply filter blur-3xl opacity-50 dark:opacity-40 animate-blob"></div>
        <!-- Blue/Cyan Blob -->
        <div class="absolute top-[20%] right-[-10%] w-72 h-72 md:w-96 md:h-96 bg-cyan-300 dark:bg-blue-800 rounded-full mix-blend-multiply filter blur-3xl opacity-50 dark:opacity-40 animate-blob animation-delay-2000"></div>
        <!-- Pink/Rose Blob -->
        <div class="absolute bottom-[-10%] left-[20%] w-72 h-72 md:w-96 md:h-96 bg-pink-300 dark:bg-rose-800 rounded-full mix-blend-multiply filter blur-3xl opacity-50 dark:opacity-40 animate-blob animation-delay-4000"></div>
    </div>

    <!-- Theme Toggle -->
    <div class="absolute top-6 right-6 z-50">
        <button onclick="toggleTheme()" class="w-12 h-12 rounded-full glass glass-btn flex items-center justify-center text-lg focus:outline-none">
            <i class="fas fa-sun hidden dark:block text-yellow-300"></i>
            <i class="fas fa-moon block dark:hidden text-indigo-700"></i>
        </button>
    </div>

    <!-- Loading Spinner -->
    <div id="loading-spinner" class="fixed inset-0 flex items-center justify-center z-50 backdrop-blur-xl bg-white/30 dark:bg-black/30">
        <div class="w-16 h-16 rounded-full glass flex items-center justify-center animate-spin">
            <i class="fas fa-circle-notch text-purple-600 dark:text-purple-400 text-2xl"></i>
        </div>
    </div>

    <!-- Main Content -->
    <main id="main-content" class="w-full max-w-md md:max-w-2xl mx-auto relative z-10 hidden pt-12 pb-8 opacity-0 transition-opacity duration-700">
        
        <!-- Profile Section -->
        <div class="flex flex-col items-center mb-8 text-center px-4 w-full animate-stagger delay-1">
            <!-- Profile Image Glass Frame -->
            <div class="glass rounded-[2rem] p-2 mb-4 relative shadow-lg">
                <img id="profile-image" src="" alt="Profile" 
                     class="w-28 h-28 md:w-32 md:h-32 rounded-[1.5rem] object-cover object-top" 
                     onerror="this.src='https://ui-avatars.com/api/?name=Katarimers&background=7c3aed&color=fff&size=128'">
                
                <!-- Verification Badge -->
                <div id="verified-badge" class="absolute -bottom-2 -right-2 w-8 h-8 rounded-full glass flex items-center justify-center hidden text-blue-600 dark:text-blue-400 border border-white/50" title="Verified">
                    <i class="fas fa-check text-xs"></i>
                </div>
            </div>

            <h1 id="profile-name" class="text-2xl md:text-3xl font-bold tracking-tight">...</h1>
            <p id="profile-title" class="opacity-70 font-medium mt-1 text-xs md:text-sm uppercase tracking-widest">...</p>

            <!-- Social Icons Row -->
            <div id="socials-container" class="flex flex-wrap justify-center gap-4 md:gap-6 mt-6">
                <!-- Social links injected here -->
            </div>
        </div>

        <!-- App & Links Section -->
        <div class="space-y-6 px-4 w-full animate-stagger delay-2">
            
            <!-- Category Tabs (Swipeable on Mobile) -->
            <div class="w-full fade-mask">
                <div id="category-container" class="flex gap-3 w-full overflow-x-auto pb-4 pt-2 snap-x">
                    <!-- Tabs injected here -->
                </div>
            </div>

            <!-- Search Box -->
            <div class="w-full mb-6">
                <div class="glass-input rounded-2xl flex items-center px-5 py-3 md:py-4 shadow-sm focus-within:border-white/80 dark:focus-within:border-white/40 transition-colors">
                    <i class="fas fa-search opacity-50 mr-3"></i>
                    <input type="text" id="app-search"
                        class="w-full bg-transparent outline-none text-sm md:text-base font-medium placeholder-gray-500 dark:placeholder-gray-300"
                        placeholder="Cari aplikasi atau tools...">
                </div>
            </div>

            <!-- Grid Apps (Desty.page List Style) -->
            <div id="apps-container" class="grid grid-cols-1 gap-4 pt-2">
                <!-- App links injected here -->
            </div>
        </div>

        <!-- Share Button -->
        <div class="mt-10 mb-6 flex justify-center animate-stagger delay-3">
            <button onclick="shareProfile()" class="glass glass-btn tap-effect px-6 py-3 md:px-8 md:py-4 rounded-full flex items-center gap-3 font-semibold text-sm transition-colors shadow-md">
                <i class="fas fa-share-nodes"></i> Bagikan Profil
            </button>
        </div>

        <!-- Footer -->
        <footer class="text-center mt-10 pb-4 opacity-60">
            <p class="text-xs font-medium tracking-wide">© <span id="year"></span> <span id="footer-name"></span>. <span id="footer-text"></span></p>
        </footer>

    </main>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 glass rounded-full px-6 py-3 opacity-0 transition-opacity duration-300 pointer-events-none z-50 flex items-center gap-3">
        <i class="fas fa-check text-green-500"></i>
        <span class="text-sm font-bold">Link disalin!</span>
    </div>

    <!-- Password Modal -->
    <div id="password-modal" class="fixed inset-0 hidden z-[60] flex items-center justify-center p-4 transition-all duration-300 bg-gray-900/40 backdrop-blur-sm">
        <div class="glass rounded-[2rem] border border-white/50 w-full max-w-sm p-8 transform scale-95 opacity-0 transition-all duration-300 shadow-2xl" id="password-modal-content">
            <div class="text-center mb-8">
                <div class="w-20 h-20 rounded-full glass flex items-center justify-center mx-auto mb-5 text-purple-600 dark:text-purple-400">
                    <i class="fas fa-lock text-3xl"></i>
                </div>
                <h3 class="text-2xl font-bold">Akses Terkunci</h3>
                <p class="text-sm opacity-70 mt-2">Masukkan sandi untuk <br><span id="locked-app-name" class="font-bold"></span></p>
            </div>

            <form id="password-form" class="space-y-6">
                <input type="hidden" id="locked-app-id">
                
                <div class="glass-input rounded-2xl flex items-center px-5 py-4 relative shadow-inner">
                    <i class="fas fa-key opacity-50 mr-3"></i>
                    <input type="password" id="app-password" placeholder="Password..." 
                           class="w-full bg-transparent outline-none text-center tracking-widest text-lg font-bold" required>
                    <button type="button" onclick="togglePasswordVisibility('app-password', this)" class="absolute right-5 opacity-50 hover:opacity-100 outline-none transition-opacity">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                
                <p id="password-error" class="text-red-500 dark:text-red-400 text-xs text-center hidden font-bold"></p>
                
                <div class="flex gap-4 mt-8">
                    <button type="button" onclick="closePasswordModal()" class="flex-1 glass glass-btn py-3 rounded-xl font-bold text-sm">Batal</button>
                    <button type="submit" id="unlock-btn" class="flex-1 glass glass-btn py-3 rounded-xl font-bold text-sm text-purple-600 dark:text-purple-300">Buka</button>
                </div>

                <a id="get-password-btn" href="#" target="_blank" class="block w-full text-center mt-4 pt-4 border-t border-gray-400/20 text-xs font-bold opacity-60 hover:opacity-100 transition-opacity hidden uppercase tracking-wider">
                    <i class="fas fa-external-link-alt mr-1"></i> Dapatkan Password
                </a>
            </form>
        </div>
    </div>

    <!-- Main Logic -->
    <script>
        // --- API CONFIGURATION ---
        // GANTI URL DI BAWAH INI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA!
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxOOuq8euMjbH-XNkjqdBASmj_a1qvK4DP5SiHotX_mEOspwvybUuUdFwUibl8N4r6Olw/exec';
        
        // Deteksi apakah pengguna belum mengganti URL
        const isUsingPlaceholder = SCRIPT_URL === 'ISI_DENGAN_URL_WEB_APP_GOOGLE_APPS_SCRIPT_DI_SINI';

        // --- MOCK DATA (Fallback jika URL belum diisi) ---
        const MOCK_DATA = {
            config: {
                profile_name: "iMersBiopage",
                profile_title: "Digital Creator & Visionary",
                profile_image: "https://ui-avatars.com/api/?name=iMersBiopage&background=7c3aed&color=fff&size=256",
                verified_badge: "true",
                footer_text: "Designed with Glassmorphism." // Penambahan Footer Dinamis
            },
            socials: [
                { Platform: "WhatsApp", Url: "https://wa.me", IconClass: "fab fa-whatsapp", ColorClass: "text-green-600 dark:text-green-400", Visible: "true" },
                { Platform: "GitHub", Url: "https://github.com", IconClass: "fab fa-github", ColorClass: "text-gray-900 dark:text-white", Visible: "true" },
                { Platform: "Email", Url: "mailto:hello@example.com", IconClass: "fas fa-envelope", ColorClass: "text-red-500 dark:text-red-400", Visible: "true" },
                { Platform: "LinkedIn", Url: "https://linkedin.com", IconClass: "fab fa-linkedin-in", ColorClass: "text-blue-600 dark:text-blue-400", Visible: "true" },
                { Platform: "Instagram", Url: "https://instagram.com", IconClass: "fab fa-instagram", ColorClass: "text-pink-600 dark:text-pink-400", Visible: "true" }
            ],
            apps: [
                { ID: "app1", Type: "link", Name: "AI Image Studio", Description: "Generate gambar Neumorphic", Category: "AI Tools", Url: "https://example.com/ai", IconClass: "fas fa-wand-magic-sparkles", ColorClass: "text-purple-600 dark:text-purple-400", Visible: "true", ClickCount: 2045, isLocked: false },
                
                // INI CONTOH BANNER IMAGE YANG DISISIPKAN
                { ID: "banner1", Type: "image", Name: "Promo Bundle AI", ImageUrl: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=800&auto=format&fit=crop", Url: "https://example.com/promo", Category: "Semua", Visible: "true", ClickCount: 0 },
                
                { ID: "app2", Type: "link", Name: "Financial Tracker", Description: "Hitung aset dan investasi", Category: "Produktivitas", Url: "https://example.com/finance", IconClass: "fas fa-chart-pie", ColorClass: "text-emerald-600 dark:text-emerald-400", Visible: "true", ClickCount: 890, isLocked: false },
                { ID: "app3", Type: "link", Name: "Private Blueprint", Description: "Strategi digital eksklusif", Category: "Premium", Url: "https://example.com/premium", IconClass: "fas fa-gem", ColorClass: "text-amber-500", Visible: "true", ClickCount: 120, isLocked: true, PasswordSourceUrl: "https://wa.me/628123456789", Password: "admin" },
                { ID: "app4", Type: "link", Name: "Mentoring 1-on-1", Description: "Jadwalkan sesi privat", Category: "Produktivitas", Url: "https://example.com/jadwal", IconClass: "fas fa-calendar-check", ColorClass: "text-blue-600 dark:text-blue-400", Visible: "true", ClickCount: 340, isLocked: false }
            ]
        };

        const fetchData = async () => {
            try {
                // Paksa tampilkan loading spinner saat pertama kali buka
                document.getElementById('loading-spinner').classList.remove('hidden');
                
                if (isUsingPlaceholder) {
                    console.warn("Menggunakan Mock Data sementara karena SCRIPT_URL belum diganti.");
                    return new Promise(resolve => setTimeout(() => resolve(MOCK_DATA), 800));
                }

                const response = await fetch(`${SCRIPT_URL}?action=getData`);
                if (!response.ok) throw new Error("Network response was not ok");
                const data = await response.json();
                return data;
            } catch (error) {
                console.error("Gagal mengambil data:", error);
                alert("Gagal terhubung ke database. Menampilkan data offline sementara.");
                return MOCK_DATA; // Fallback jika fetch error
            }
        };

        const verifyAppPassword = async (appId, password) => {
            try {
                if (isUsingPlaceholder) {
                    return new Promise(resolve => {
                        setTimeout(() => {
                            const app = MOCK_DATA.apps.find(a => a.ID === appId);
                            if (app && app.Password === password) {
                                resolve({ success: true, url: app.Url });
                            } else {
                                resolve({ success: false, message: "Sandi salah. Coba lagi." });
                            }
                        }, 600);
                    });
                }

                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'verifyPassword', appId: appId, password: password }),
                    headers: {
                        // text/plain digunakan agar API Google Sheets tidak nge-block dengan CORS preflight error
                        'Content-Type': 'text/plain;charset=utf-8', 
                    }
                });
                return await response.json();
            } catch (error) {
                console.error("Gagal verifikasi password:", error);
                return { success: false, message: "Koneksi terputus. Periksa jaringan Anda." };
            }
        };

        const incrementAppClick = async (appId) => {
            if (isUsingPlaceholder) {
                const app = MOCK_DATA.apps.find(a => a.ID === appId);
                if (app) app.ClickCount++;
                return;
            }

            try {
                // Jalan di background secara asinkron tanpa harus ditunggu
                fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'incrementClick', appId: appId }),
                    headers: {
                        'Content-Type': 'text/plain;charset=utf-8',
                    }
                });
            } catch (error) {
                console.error("Gagal menghitung klik:", error);
            }
        };

        // --- CORE LOGIC ---
        let currentApps = [];
        let activeCategory = 'Semua';

        async function init() {
            const data = await fetchData();
            if (!data) return;

            currentApps = data.apps.filter(app => String(app.Visible).toLowerCase() === 'true');
            
            renderProfile(data.config);
            renderSocials(data.socials);
            renderCategories(currentApps);
            renderApps(currentApps);

            document.getElementById('loading-spinner').classList.add('hidden');
            const mainContent = document.getElementById('main-content');
            mainContent.classList.remove('hidden');
            setTimeout(() => { mainContent.classList.remove('opacity-0'); }, 50);

            document.getElementById('year').innerText = new Date().getFullYear();
            document.getElementById('footer-name').innerText = data.config.profile_name;
            // Update teks footer dinamis
            document.getElementById('footer-text').innerText = data.config.footer_text || 'Designed with Glassmorphism.';

            setupSearch();
        }

        function renderCategories(apps) {
            const container = document.getElementById('category-container');
            const allCats = apps.flatMap(a => (a.Category || '').split(',').map(c => c.trim()).filter(Boolean));
            const uniqueCats = [...new Set(allCats)].sort((a, b) => a.localeCompare(b));
            const finalCats = ['Semua', ...uniqueCats];

            container.innerHTML = finalCats.map(cat => {
                const id = `btn-cat-${cat.replace(/\s+/g, '-')}`;
                const baseClass = "px-5 py-2.5 rounded-2xl text-xs md:text-sm font-bold whitespace-nowrap transition-all outline-none snap-start glass glass-btn";
                const activeClass = cat === 'Semua' ? 'glass-active' : '';
                return `<button onclick="window.filterCategory('${cat}')" id="${id}" class="${baseClass} ${activeClass}">${cat}</button>`;
            }).join('');
        }

        window.filterCategory = (category) => {
            activeCategory = category;
            const buttons = document.querySelectorAll('#category-container button');
            
            buttons.forEach(btn => {
                btn.classList.remove('glass-active');
            });

            const activeBtn = document.getElementById(`btn-cat-${category.replace(/\s+/g, '-')}`);
            if(activeBtn) {
                activeBtn.classList.add('glass-active');
            }

            document.getElementById('app-search').dispatchEvent(new Event('input'));
        };

        function setupSearch() {
            const searchInput = document.getElementById('app-search');
            searchInput.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                const appsCards = document.querySelectorAll('#apps-container > a');

                appsCards.forEach(app => {
                    const appCategories = (app.getAttribute('data-category') || '').split(',').map(c => c.trim());
                    // Cek elemen text pada link biasa (h3, p) atau alt pada image
                    const name = (app.querySelector('h3')?.innerText || app.querySelector('img')?.alt || '').toLowerCase();
                    const desc = (app.querySelector('p')?.innerText || '').toLowerCase();
                    
                    const matchesSearch = name.includes(term) || desc.includes(term);
                    const matchesCategory = activeCategory === 'Semua' || appCategories.includes(activeCategory);

                    if (matchesSearch && matchesCategory) {
                        app.style.display = 'block';
                    } else {
                        app.style.display = 'none';
                    }
                });
            });
        }

        function renderProfile(config) {
            document.getElementById('profile-name').innerText = config.profile_name;
            document.getElementById('profile-title').innerText = config.profile_title;
            document.getElementById('profile-image').src = config.profile_image;
            if (String(config.verified_badge).toLowerCase() === 'true') {
                document.getElementById('verified-badge').classList.remove('hidden');
            }
        }

        function renderSocials(socials) {
            const container = document.getElementById('socials-container');
            container.innerHTML = '';
            socials.filter(s => String(s.Visible).toLowerCase() === 'true').forEach((s, index) => {
                const a = document.createElement('a');
                a.href = s.Url;
                a.target = "_blank";
                const iconColor = s.ColorClass || '';
                a.className = `w-12 h-12 md:w-14 md:h-14 rounded-full glass glass-btn tap-effect flex items-center justify-center text-xl md:text-2xl group shadow-sm animate-stagger`;
                a.style.animationDelay = `${0.15 + (index * 0.05)}s`; // Efek berurutan
                a.innerHTML = `<i class="${s.IconClass} ${iconColor} group-hover:scale-110 transition-transform"></i>`;
                container.appendChild(a);
            });
        }

        function renderApps(apps) {
            const container = document.getElementById('apps-container');
            container.innerHTML = '';

            apps.filter(app => String(app.Visible).toLowerCase() === 'true').forEach((app, index) => {
                const isLocked = app.isLocked || false;
                const itemType = app.Type || 'link'; // Defaultnya link
                
                const link = document.createElement('a');
                link.href = isLocked ? '#' : app.Url || '#';
                if(!isLocked && app.Url) link.target = '_blank';
                link.setAttribute('data-category', app.Category || '');

                if (isLocked) {
                    link.onclick = (e) => { e.preventDefault(); openPasswordModal(app.ID, app.Name, app.PasswordSourceUrl); };
                } else if (app.Url) {
                     link.addEventListener('click', () => incrementAppClick(app.ID));
                }

                // Jika Tipe-nya adalah Gambar (Banner)
                if (itemType.toLowerCase() === 'image') {
                    link.className = `block w-full tap-effect rounded-[1.5rem] overflow-hidden relative group cursor-pointer animate-stagger shadow-md glass p-1`;
                    link.style.animationDelay = `${0.3 + (index * 0.08)}s`;
                    
                    link.innerHTML = `
                        <div class="relative w-full rounded-[1.2rem] overflow-hidden">
                            <img src="${app.ImageUrl}" alt="${app.Name || 'Banner'}" class="w-full h-auto object-cover group-hover:scale-105 transition-transform duration-500">
                            <div class="absolute inset-0 bg-black/5 group-hover:bg-transparent transition-colors"></div>
                        </div>
                    `;
                } 
                // Jika Tipe-nya adalah Link (Card Horizontal Standar)
                else {
                    link.className = `block glass glass-card tap-effect rounded-[1.5rem] p-3 md:p-4 relative overflow-hidden group cursor-pointer animate-stagger`;
                    link.style.animationDelay = `${0.3 + (index * 0.08)}s`; 

                    const lockIcon = isLocked ? `<i class="fas fa-lock text-[10px] ml-2 opacity-50"></i>` : '';
                    const isPopular = (app.ClickCount || 0) > 1000;
                    const iconColor = app.ColorClass || '';
                    
                    const popularBadge = isPopular ? `<div class="absolute top-0 right-0 glass rounded-bl-xl rounded-tr-[1.5rem] px-3 py-1 text-[9px] font-bold text-red-500 uppercase border-t-0 border-r-0"><i class="fas fa-fire mr-1"></i>Hot</div>` : '';

                    link.innerHTML = `
                        ${popularBadge}
                        <div class="flex items-center gap-4 w-full">
                            <div class="flex-shrink-0 w-12 h-12 md:w-16 md:h-16 rounded-xl md:rounded-[1.2rem] glass-input flex items-center justify-center ${iconColor} text-xl md:text-3xl group-hover:scale-110 transition-transform duration-300 shadow-sm border border-white/40">
                                <i class="${app.IconClass}"></i>
                            </div>
                            
                            <div class="flex-grow min-w-0 flex flex-col justify-center">
                                <h3 class="font-bold text-sm md:text-base truncate pr-2 flex items-center">
                                    ${app.Name} ${lockIcon}
                                </h3>
                                ${app.Description ? `<p class="text-xs opacity-70 truncate pr-2 mt-1">${app.Description}</p>` : ''}
                            </div>
                            
                            <div class="flex-shrink-0 flex items-center pr-2">
                                <div class="w-8 h-8 rounded-full glass flex items-center justify-center opacity-70 group-hover:opacity-100 group-hover:bg-white/20 transition-all">
                                    <i class="fas fa-chevron-right text-xs"></i>
                                </div>
                            </div>
                        </div>
                    `;
                }
                
                container.appendChild(link);
            });
        }

        // --- PASSWORD MODAL ---
        window.togglePasswordVisibility = (inputId, btn) => {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text'; icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password'; icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        };

        window.openPasswordModal = (appId, appName, passwordSourceUrl) => {
            const modal = document.getElementById('password-modal');
            const content = document.getElementById('password-modal-content');
            
            document.getElementById('locked-app-id').value = appId;
            document.getElementById('locked-app-name').innerText = appName;
            document.getElementById('app-password').value = '';
            document.getElementById('password-error').classList.add('hidden');

            const getPassBtn = document.getElementById('get-password-btn');
            if (passwordSourceUrl) {
                getPassBtn.href = passwordSourceUrl;
                getPassBtn.classList.remove('hidden');
            } else {
                getPassBtn.classList.add('hidden');
            }

            modal.classList.remove('hidden');
            setTimeout(() => {
                content.classList.remove('scale-95', 'opacity-0');
                content.classList.add('scale-100', 'opacity-100');
            }, 10);
            document.getElementById('app-password').focus();
        };

        window.closePasswordModal = () => {
            const modal = document.getElementById('password-modal');
            const content = document.getElementById('password-modal-content');
            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        };

        document.getElementById('password-form').onsubmit = async (e) => {
            e.preventDefault();
            const appId = document.getElementById('locked-app-id').value;
            const password = document.getElementById('app-password').value;
            const btn = document.getElementById('unlock-btn');
            const errorMsg = document.getElementById('password-error');

            const originalText = btn.innerText;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i>';
            btn.disabled = true;
            errorMsg.classList.add('hidden');

            try {
                const res = await verifyAppPassword(appId, password);
                if (res.success) {
                    incrementAppClick(appId);
                    window.open(res.url, '_blank');
                    closePasswordModal();
                } else {
                    errorMsg.innerText = res.message;
                    errorMsg.classList.remove('hidden');
                    const content = document.getElementById('password-modal-content');
                    content.classList.add('animate-pulse');
                    setTimeout(() => content.classList.remove('animate-pulse'), 300);
                }
            } catch (err) {
                errorMsg.innerText = "Koneksi terputus.";
                errorMsg.classList.remove('hidden');
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        };

        function toggleTheme() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
            }
        }

        function shareProfile() {
            if (navigator.share) {
                navigator.share({ title: document.title, url: window.location.href }).catch(console.error);
            } else {
                const dummy = document.createElement('input');
                document.body.appendChild(dummy);
                dummy.value = window.location.href;
                dummy.select();
                document.execCommand('copy');
                document.body.removeChild(dummy);
                
                const toast = document.getElementById('toast');
                toast.classList.remove('opacity-0', 'pointer-events-none');
                setTimeout(() => toast.classList.add('opacity-0', 'pointer-events-none'), 3000);
            }
        }

        init();
    </script>
</body>
</html>
